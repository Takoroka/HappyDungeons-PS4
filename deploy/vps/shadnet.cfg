[General]
# shadNet for the Happy Dungeons PS4 gateway. Host is shared by the game port, the STUN (signalling) port and
# the WebAPI port, so it must be 0.0.0.0 for players' STUN/WebAPI; the game port (31413) is NOT opened in ufw:
# players reach shadNet only through the gateway on 31313.
Host=0.0.0.0
UnsecuredPort=31413
MatchingUdpPort=31314
WebApiPort=31315
StatsEnabled=false
Matching2Enabled=true
Matching2MaxUsers=0
TrophiesEnabled=true
AvatarBaseUrl=http://107.170.39.185/avatar/
MemberApiEnabled=false
MemberApiHost=127.0.0.1
AdminApiEnabled=true
AdminApiHost=127.0.0.1
AdminApiPort=31350
EmailValidated=false
# filled in by install.sh (random, also in gateway.json): only the gateway can create accounts
RegistrationSecretKey=__REGISTRATION_KEY__
AdminsList=HDGateway
LogFile=shadnet.log
