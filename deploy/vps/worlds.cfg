# Matchmaking worlds for Happy Dungeons (PS4, CUSA09120).
# The game picks a world by INDEX from DungeonLobbyMenuParam.json (lobbyMatching_):
#   Story: SIEJA 0, SIEA 1, SIEE 2 | Mugen: 3, 4, 5 | Event: 6, 7, 8   (world0..world9 = 0..9)
# so it needs ten worlds on server 1 (the server id it asks for).
[groups]
CUSA09120 = happydungeons

[worlds]
# GROUP | WORLD_ID | SERVER_ID | LOBBIES_NUM | MAX_LOBBY_MEMBERS
happydungeons | 1 | 1 | 1 | 100
happydungeons | 2 | 1 | 1 | 100
happydungeons | 3 | 1 | 1 | 100
happydungeons | 4 | 1 | 1 | 100
happydungeons | 5 | 1 | 1 | 100
happydungeons | 6 | 1 | 1 | 100
happydungeons | 7 | 1 | 1 | 100
happydungeons | 8 | 1 | 1 | 100
happydungeons | 9 | 1 | 1 | 100
happydungeons | 10 | 1 | 1 | 100
